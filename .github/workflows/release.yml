name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the computed version without tagging or releasing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: oskarrn93/github-actions/.github/workflows/semver-release.yml@da698a589fd694fa38175bc7af7404b4a509faab # v1
    with:
      dry-run: ${{ inputs.dry-run }}
      create-release: false
      client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
