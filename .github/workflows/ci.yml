name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Core packages are pure Go, so they are tested on cheap Linux runners.
  # Fuzzing runs here because Windows Smart App Control can block the
  # instrumented fuzz binary on developer machines.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./internal/... ./cmd/...
      - run: go test -race ./internal/... ./cmd/...
      - run: go test ./internal/m3u -run '^$' -fuzz FuzzParse -fuzztime 60s

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test ./...
      # -trimpath; no UPX (packed binaries trigger antivirus false positives).
      - run: go tool wails build -clean -trimpath
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-client-windows-amd64
          path: build/bin/iptv-client.exe

  # macOS runners cost 10x Actions minutes on private repos: tags/manual only.
  build-macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go tool wails build -clean -trimpath -platform darwin/universal
      # Ad-hoc signature (no developer account needed); required on Apple Silicon.
      - run: codesign --force --deep --sign - build/bin/iptv-client.app
      - run: ditto -c -k --keepParent build/bin/iptv-client.app iptv-client-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-client-macos-universal
          path: iptv-client-macos-universal.zip

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: |
          cd dist
          (cd iptv-client-windows-amd64 && zip -q ../iptv-client-windows-amd64.zip iptv-client.exe)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            iptv-client-windows-amd64.zip iptv-client-macos-universal/iptv-client-macos-universal.zip
        env:
          GH_TOKEN: ${{ github.token }}
