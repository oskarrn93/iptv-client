name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly run is fuzz-only, with a much longer fuzz time.
  schedule:
    - cron: '0 3 * * *'
  # build.yml runs these checks before building release binaries.
  workflow_call:

permissions:
  contents: read

jobs:
  # Core packages are pure Go, so they are tested on cheap Linux runners.
  test:
    if: github.event_name != 'schedule'
    uses: oskarrn93/github-actions/.github/workflows/go-test.yml@cf66633427573d9d5b3a1e0969f3d0575fdd681f # v1
    with:
      packages: ./internal/... ./cmd/...

  govulncheck:
    if: github.event_name != 'schedule'
    uses: oskarrn93/github-actions/.github/workflows/govulncheck.yml@cf66633427573d9d5b3a1e0969f3d0575fdd681f # v1
    with:
      packages: ./internal/... ./cmd/...

  actionlint:
    if: github.event_name != 'schedule'
    uses: oskarrn93/github-actions/.github/workflows/actionlint.yml@cf66633427573d9d5b3a1e0969f3d0575fdd681f # v1

  # Fuzzing runs here because Windows Smart App Control can block the
  # instrumented fuzz binary on developer machines.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pkg: ./internal/m3u, target: FuzzParse, pr: 15s, nightly: 10m}
          - {pkg: ./internal/redact, target: FuzzString, pr: 15s, nightly: 10m}
          - {pkg: ./internal/epg, target: FuzzParse, pr: 15s, nightly: 10m}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Carries the fuzzing engine's discovered inputs from night to night.
      - if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.pkg }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.pkg }}-
      - run: go test ${{ matrix.pkg }} -run '^$' -fuzz ${{ matrix.target }} -fuzztime ${{ github.event_name == 'schedule' && matrix.nightly || matrix.pr }}
      - if: always() && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.pkg }}-${{ github.run_id }}
      # A crashing input is only written into the runner's checkout.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.pkg == './internal/m3u' && 'm3u' || matrix.pkg == './internal/epg' && 'epg' || 'redact' }}
          path: internal/*/testdata/fuzz

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Untrusted playlist text must never be parsed as HTML (C3 in the review).
      - name: Reject HTML sinks
        run: |
          ! grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|\beval\(|new Function' src
      - run: npm ci
      # Builds dist (with the production CSP) and drives it in Chrome.
      - run: npm run test:e2e
        env:
          E2E_BROWSER: chrome

  # Release binaries are built by build.yml. This job keeps the Windows-only
  # checks on PRs, e.g. so a Dependabot Wails bump that changes bindings fails.
  windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # main.go embeds frontend/dist, which is only built by wails build.
      - name: Create placeholder frontend/dist
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/gitkeep
      - run: go test ./...
      - run: go tool wails generate module
      # Committed bindings must match the exported Go API.
      - name: Check generated bindings are committed
        run: git diff --exit-code -- frontend/wailsjs
