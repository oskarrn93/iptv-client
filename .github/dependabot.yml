version: 2

# Minor and patch bumps are grouped into one PR per ecosystem to keep the
# noise down; major bumps still get their own PR so breaking changes are
# reviewed individually. Security updates are not grouped and arrive as soon
# as an advisory is published.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
    # The Wails v2 CLI needs clir v1.3.0: newer versions ignore the Default()
    # methods it uses for flag defaults (see the note in go.mod).
    ignore:
      - dependency-name: github.com/leaanthony/clir

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
